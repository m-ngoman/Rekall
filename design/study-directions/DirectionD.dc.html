<!doctype html>
<html>

</head>
<body>
<x-dc>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: oklch(0.6 0.13 65); }
    a:hover { color: oklch(0.5 0.13 65); }
  </style>
</helmet>
<div style="width:480px;height:760px;background:oklch(0.985 0.004 80);color:oklch(0.18 0.01 260);display:flex;flex-direction:column;padding:28px;position:relative;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.01 260)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;color:oklch(0.5 0.01 260);text-transform:uppercase">Back</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="width:6px;height:6px;border-radius:50%;background:oklch(0.62 0.13 145)"></div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;color:oklch(0.5 0.01 260);text-transform:uppercase">Synced</span>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;color:oklch(0.55 0.01 260);white-space:nowrap">CARD</span>
    <div style="flex:1;height:3px;background:oklch(0.9 0.005 90);border-radius:2px;overflow:hidden;position:relative">
      <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, transparent, transparent 7px, oklch(0.985 0.004 80) 7px, oklch(0.985 0.004 80) 8px);z-index:2"></div>
      <div style="width:58%;height:100%;background:oklch(0.62 0.14 65)"></div>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:oklch(0.35 0.01 260);white-space:nowrap;font-variant-numeric:tabular-nums">07 / 12</span>
  </div>

  <div style="flex:1;border:1px solid oklch(0.9 0.005 90);border-radius:10px;background:oklch(1 0 0);padding:30px;display:flex;flex-direction:column;gap:22px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.6 0.13 65);align-self:flex-start;border:1px solid oklch(0.85 0.06 65);border-radius:3px;padding:3px 9px">Cell Biology</span>

    <div style="font-size:23px;font-weight:500;line-height:1.4;letter-spacing:-0.005em;color:oklch(0.14 0.01 260)">
      What organelle is responsible for producing ATP through cellular respiration?
    </div>

    <div style="height:1px;background:oklch(0.92 0.004 90)"></div>

    <div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.55 0.01 260);margin-bottom:8px">Your answer</div>
      <div style="font-size:16px;line-height:1.5;color:oklch(0.3 0.01 260)">the mitochondria</div>
    </div>

    <div>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.5 0.13 150);background:oklch(0.95 0.03 150);padding:5px 12px;border-radius:4px">Good</span>
    </div>

    <div style="font-size:14px;line-height:1.65;color:oklch(0.48 0.01 260)">
      Correct — matches the reference answer closely.
    </div>
  </div>

  <div style="margin:16px 0;display:flex;gap:16px">
    <div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:1px;background:oklch(0.55 0.19 25)"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.04em;color:oklch(0.55 0.01 260)">FORGOT</span></div>
    <div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:1px;background:oklch(0.68 0.14 60)"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.04em;color:oklch(0.55 0.01 260)">HARD</span></div>
    <div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:1px;background:oklch(0.5 0.13 150)"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.04em;color:oklch(0.55 0.01 260)">GOOD</span></div>
    <div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;border-radius:1px;background:oklch(0.62 0.14 65)"></div><span style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.04em;color:oklch(0.55 0.01 260)">EASY</span></div>
  </div>

  <button style="width:100%;padding:16px;border:none;border-radius:8px;background:oklch(0.18 0.01 260);color:oklch(0.98 0 0);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Next →</button>
</div>
</x-dc>
