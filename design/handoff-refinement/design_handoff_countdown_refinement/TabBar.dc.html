<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<nav aria-label="Main" style="box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:space-around;max-width:440px;margin:0 auto;border-radius:var(--r-full);border:1px solid var(--rule);background:var(--surface);padding:10px 14px;font-family:var(--font-body)">
  <button aria-current="{{ cur.home }}" style="position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 4px;border-radius:var(--r-full);color:{{ c.home }};background:{{ bg.home }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11l10-8 10 8"></path><path d="M4.5 10.5V19a1 1 0 0 0 1 1h4v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h4a1 1 0 0 0 1-1v-8.5"></path></svg><span style="font-size:10px;font-weight:700">Home</span></button>
  <button aria-current="{{ cur.cards }}" style="position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 4px;border-radius:var(--r-full);color:{{ c.cards }};background:{{ bg.cards }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="3"></rect><path d="M3 7v13a1 1 0 0 0 1 1h13" opacity="0.55"></path></svg><span style="font-size:10px;font-weight:700">Cards</span></button>
  <button aria-current="{{ cur.calendar }}" style="position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 4px;border-radius:var(--r-full);color:{{ c.calendar }};background:{{ bg.calendar }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><circle cx="12" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle></svg><span style="font-size:10px;font-weight:700">Calendar</span></button>
  <button aria-current="{{ cur.notes }}" style="position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 4px;border-radius:var(--r-full);color:{{ c.notes }};background:{{ bg.notes }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg><span style="font-size:10px;font-weight:700">Notes</span></button>
  <button aria-current="{{ cur.tutor }}" style="position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:8px 4px;border-radius:var(--r-full);color:{{ c.tutor }};background:{{ bg.tutor }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path><circle cx="8.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle></svg><span style="font-size:10px;font-weight:700">Tutor</span></button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:350,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;cards&quot;,&quot;calendar&quot;,&quot;notes&quot;,&quot;tutor&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const c = {}, bg = {}, cur = {};
    for (const t of ['home', 'cards', 'calendar', 'notes', 'tutor']) {
      const on = t === active;
      c[t] = on ? 'var(--accent)' : 'var(--text-muted)';
      bg[t] = on ? 'var(--accent-dim)' : 'transparent';
      cur[t] = on ? 'page' : undefined;
    }
    return { c, bg, cur };
  }
}
</script>
</body>
</html>
