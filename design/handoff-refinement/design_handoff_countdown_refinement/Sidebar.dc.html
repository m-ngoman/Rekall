<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="tokens.css">
</helmet>
<nav aria-label="Main" style="box-sizing:border-box;width:240px;height:100%;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--surface);padding:18px;font-family:var(--font-body);color:var(--text)">
  <div style="display:flex;align-items:center;gap:10px;padding:8px 10px 28px;font-size:18px;font-weight:700;letter-spacing:{{ wordTracking }};color:{{ wordColor }}">
    <svg width="26" height="26" viewBox="0 0 120 120" fill="none" role="img" aria-label="Rekall" style="color:var(--text-muted);flex-shrink:0">
      <g stroke="currentColor" stroke-opacity="0.42" stroke-linecap="round"><line x1="26" y1="84" x2="56" y2="92" stroke-width="6"></line><line x1="56" y1="92" x2="38" y2="58" stroke-width="6"></line><line x1="38" y1="58" x2="26" y2="84" stroke-width="6"></line><line x1="38" y1="58" x2="88" y2="40" stroke-width="5.5"></line><line x1="56" y1="92" x2="88" y2="40" stroke-width="5.5"></line></g>
      <g fill="currentColor"><circle cx="26" cy="84" r="8.5" fill-opacity="0.58"></circle><circle cx="56" cy="92" r="8.5" fill-opacity="0.58"></circle><circle cx="38" cy="58" r="8.5" fill-opacity="0.58"></circle><circle cx="88" cy="40" r="13.5" fill="{{ nodeColor }}"></circle></g>
    </svg>
    Rekall
  </div>
  <div style="display:flex;flex-direction:column;gap:4px">
    <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.home }};color:{{ c.home }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11l10-8 10 8"></path><path d="M4.5 10.5V19a1 1 0 0 0 1 1h4v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h4a1 1 0 0 0 1-1v-8.5"></path></svg>Home</button>
    <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.cards }};color:{{ c.cards }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="3"></rect><path d="M3 7v13a1 1 0 0 0 1 1h13" opacity="0.55"></path></svg>Cards</button>
    <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.calendar }};color:{{ c.calendar }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><circle cx="12" cy="15.5" r="1.1" fill="currentColor" stroke="none"></circle></svg>Calendar</button>
    <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.notes }};color:{{ c.notes }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Notes</button>
    <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.tutor }};color:{{ c.tutor }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path><circle cx="8.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle></svg>Tutor</button>
  </div>
  <div style="flex:1"></div>
  <button style="display:flex;align-items:center;gap:12px;border-radius:var(--r-full);padding:10px 14px;font-size:14px;font-weight:700;background:{{ bg.settings }};color:{{ c.settings }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><circle cx="15" cy="6" r="2.4" fill="var(--surface)"></circle><line x1="3" y1="12" x2="21" y2="12"></line><circle cx="9" cy="12" r="2.4" fill="var(--surface)"></circle><line x1="3" y1="18" x2="21" y2="18"></line><circle cx="17" cy="18" r="2.4" fill="var(--surface)"></circle></svg>Settings</button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:800},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;cards&quot;,&quot;calendar&quot;,&quot;notes&quot;,&quot;tutor&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;v2&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const v2 = this.props.v2 ?? false;
    const tabs = ['home', 'cards', 'calendar', 'notes', 'tutor', 'settings'];
    const c = {}, bg = {};
    for (const t of tabs) {
      c[t] = t === active ? 'var(--accent)' : 'var(--text-muted)';
      bg[t] = t === active ? 'var(--accent-dim)' : 'transparent';
    }
    return {
      c, bg,
      wordColor: 'var(--text)',
      wordTracking: v2 ? '-0.03em' : '-0.025em',
      nodeColor: v2 ? 'var(--text)' : 'currentColor',
    };
  }
}
</script>
</body>
</html>
