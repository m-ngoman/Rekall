      <button style="width:38px;height:38px;border-radius:50%;background:oklch(1 0 0);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px oklch(0.4 0.02 50 / 0.08);cursor:pointer">

    <div style="background:oklch(1 0 0);border-radius:26px;padding:22px;display:flex;align-items:center;gap:20px;box-shadow:0 4px 18px oklch(0.4 0.03 50 / 0.07)">

          <circle cx="46" cy="46" r="39" fill="none" stroke="oklch(0.93 0.015 75)" stroke-width="10"/>
          <circle cx="46" cy="46" r="39" fill="none" stroke="oklch(0.68 0.16 40)" stroke-width="10" stroke-linecap="round" stroke-dasharray="171 245" transform="rotate(-90 46 46)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-size:20px;font-weight:800;line-height:1">14</span>
          <span style="font-size:10px;color:oklch(0.55 0.02 50);font-weight:600">of 20</span>
        </div>
      </div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="oklch(0.72 0.16 55)" d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1-1-2-1-2 2 1 3 3 3 5a5 5 0 0 1-10 0c0-5 3-6 5-11z"/></svg>
          <span style="font-size:15px;font-weight:700">6-day streak</span>
        </div>
        <div style="font-size:13px;color:oklch(0.55 0.02 50);line-height:1.5">You're on a roll — 6 more cards to hit today's goal.</div>
      </div>
    </div>

    <div>
      <div style="font-size:16px;font-weight:800;margin-bottom:12px">Your Decks</div>
      <div style="display:flex;flex-direction:column;gap:10px">

        <div style="background:oklch(1 0 0);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 12px oklch(0.4 0.03 50 / 0.06)">

          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700">Bio 101</div>
            <div style="font-size:12px;color:oklch(0.55 0.02 50);margin-top:1px">10 cards left today</div>
          </div>
          <div style="display:flex;gap:6px">
            <span style="font-size:11px;font-weight:700;color:oklch(0.62 0.16 25);background:oklch(0.95 0.05 25);padding:4px 10px;border-radius:100px">7 due</span>

            <span style="font-size:19px;font-weight:800;color:oklch(0.99 0.01 145)">S</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700">Spanish Vocab</div>
            <div style="font-size:12px;color:oklch(0.55 0.02 50);margin-top:1px">12 new cards to learn</div>
          </div>
          <div style="display:flex;gap:6px">
            <span style="font-size:11px;font-weight:700;color:oklch(0.62 0.1 145);background:oklch(0.95 0.04 145);padding:4px 10px;border-radius:100px">12 new</span>
          </div>
        </div>

        <div style="background:oklch(1 0 0);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 12px oklch(0.4 0.03 50 / 0.06)">
          <div style="width:46px;height:46px;border-radius:14px;background:oklch(0.6 0.1 250);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="font-size:19px;font-weight:800;color:oklch(0.99 0.01 250)">O</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700">Organic Chemistry</div>
            <div style="font-size:12px;color:oklch(0.55 0.02 50);margin-top:1px">All caught up</div>
          </div>
          <div style="display:flex;gap:6px">
            <span style="font-size:11px;font-weight:700;color:oklch(0.62 0.1 145);background:oklch(0.95 0.04 145);padding:4px 10px;border-radius:100px">✓ done</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:20px;background:oklch(1 0 0);border-radius:100px;padding:10px 14px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 8px 24px oklch(0.4 0.04 50 / 0.14)">

    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;background:oklch(0.95 0.05 40);border-radius:100px;padding:8px 16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.16 40)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 11l10-8 10 8"/><path d="M4.5 10.5V19a1 1 0 0 0 1 1h4v-5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5h4a1 1 0 0 0 1-1v-8.5"/>
      </svg>
      <span style="font-size:10px;font-weight:700;color:oklch(0.62 0.16 40)">Home</span>

    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.02 50)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.02 50)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>
      </svg>
      <span style="font-size:10px;font-weight:600;color:oklch(0.6 0.02 50)">Notes</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.02 50)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <span style="font-size:10px;font-weight:600;color:oklch(0.6 0.02 50)">Tutor</span>
