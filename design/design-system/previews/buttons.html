<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
.primary { display: block; width: 100%; padding: 16px; border-radius: var(--r-full); background: var(--accent); font-size: 17px; font-weight: 700; text-align: center; }
.primary.small { display: inline-block; width: auto; padding: 10px 16px; font-size: 14px; }
.secondary { display: inline-block; padding: 14px 24px; border-radius: var(--r-full); border: 1px solid var(--rule); font-size: 15px; font-weight: 600; }
.quiet { display: block; width: 100%; padding: 16px; border-radius: var(--r-full); border: 1px solid var(--rule); font-size: 15px; font-weight: 600; color: var(--text-muted); text-align: center; }
.textbtn { font-size: 13px; font-weight: 700; color: var(--text-muted); }
.link { font-size: 15px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.icon { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: var(--r-sm); color: var(--text-muted); }
.round { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: var(--r-full); background: var(--accent); }
.chip { display: inline-flex; height: 32px; align-items: center; gap: 6px; padding: 0 12px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; color: var(--text-muted); }
.chip.active { background: var(--bg); }
.line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.disabled { opacity: .5; }
</style></head><body><div class="panes">
<section class="pane theme-dark"><h2>Dark</h2><div class="stack">
<button class="primary on-accent">Start today's 41</button>
<button class="primary on-accent disabled">Checking</button>
<button class="quiet">Nothing due. Come back tomorrow.</button>
<div class="line"><button class="primary small on-accent">Add exam</button><button class="secondary">Add cards</button><button class="textbtn">Sign out</button><a class="link">Generate flashcards from notes instead</a></div>
<div class="line"><button class="icon" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button><button class="icon" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg></button><button class="round on-accent" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button><button class="round on-accent" aria-label="Voice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button><span class="chip active">Direct</span><span class="chip">Memory</span></div>
</div></section>
<section class="pane theme-light"><h2>Light</h2><div class="stack">
<button class="primary on-accent">Start today's 41</button>
<button class="primary on-accent disabled">Checking</button>
<button class="quiet">Nothing due. Come back tomorrow.</button>
<div class="line"><button class="primary small on-accent">Add exam</button><button class="secondary">Add cards</button><button class="textbtn">Sign out</button><a class="link">Generate flashcards from notes instead</a></div>
<div class="line"><button class="icon" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button><button class="icon" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg></button><button class="round on-accent" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button><button class="round on-accent" aria-label="Voice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button><span class="chip active" style="background:var(--bg)">Direct</span><span class="chip">Memory</span></div>
</div></section></div></body></html>
