<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Rekall</title>
<meta name="description" content="That page isn't here." />
<!-- Nothing to index: this is what every dead URL on the domain resolves to. -->
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<style>
  /* Same plain-HTML idiom as privacy.html and terms.html — system fonts, one accent, no build
     step and no webfont request, because an error page should be the cheapest thing on the site. */
  :root { color-scheme: light dark; }
  body { max-width: 42rem; margin: 0 auto; padding: 4rem 1.25rem 6rem;
         font: 16px/1.65 -apple-system, system-ui, "Segoe UI", sans-serif; }
  .code { font-size: 5.5rem; line-height: .9; font-weight: 800; letter-spacing: -.045em;
          color: #c2410c; margin: 0 0 .75rem; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  .links { margin-top: 2rem; }
  a { color: #c2410c; }
  @media (prefers-color-scheme: dark) {
    a, .code { color: #f77c4f; }
  }
</style>
</head>
<body>
<p class="code">404</p>
<h1>We can&rsquo;t Rekall that one.</h1>
<p>The page you asked for isn&rsquo;t here &mdash; either the link is wrong, or whatever lived at
this address has been deleted.</p>
<p>It&rsquo;s marked Forgot. Unlike your cards, it isn&rsquo;t coming back.</p>
<p class="links"><a href="/">Back to Rekall</a> &middot; <a href="/blog/">Blog</a></p>
</body>
</html>
