<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PipCards layout audit</title>
<style>
  body { margin:0; font:14px/1.5 -apple-system,system-ui,sans-serif; background:#111; color:#eee }
  #out { padding:12px; white-space:pre-wrap; word-break:break-word; font:11px/1.4 ui-monospace,Menlo,monospace }
  #f { width:100%; height:60vh; border:0; background:#fff; display:block }
</style>
<body>
<div id="out">Measuring all four tabs… ~20 seconds. Leave this open.</div>
<iframe id="f" src="/"></iframe>
<script>
const out = document.getElementById('out')
const lines = []
const wait = ms => new Promise(r => setTimeout(r, ms))

function sel(el) {
  let s = el.tagName.toLowerCase()
  const c = (el.getAttribute('class') || '').trim()
  if (c) s += '.' + c.split(/\s+/).slice(0, 5).join('.')
  return s.slice(0, 100)
}

function audit(label, d, w) {
  const de = d.documentElement
  const vw = de.clientWidth
  const over = Math.max(de.scrollWidth, d.body.scrollWidth) - vw
  lines.push(`### ${label}: vw=${vw} scrollW=${de.scrollWidth} OVERFLOW=${over}`)
  const hits = []
  for (const el of d.querySelectorAll('*')) {
    const r = el.getBoundingClientRect()
    if (!r.width && !r.height) continue
    const past = r.right - vw
    if (past > 0.5 || r.left < -0.5) {
      hits.push({ past: Math.max(past, -r.left), r, el, pos: w.getComputedStyle(el).position })
    }
  }
  // Drop any element that has an overflowing descendant. An ancestor is wide *because* of what's
  // inside it, so listing ancestors just reprints the same overflow at every level and buries the
  // one element actually responsible. What's left is the leaf-most offender.
  const els = new Set(hits.map(h => h.el))
  const leaves = hits.filter(h => ![...els].some(o => o !== h.el && h.el.contains(o)))
  leaves.sort((a, b) => b.past - a.past)
  for (const h of leaves.slice(0, 10)) {
    const txt = (h.el.textContent || '').trim().slice(0, 28).replace(/\s+/g, ' ')
    lines.push(`  +${h.past.toFixed(0)} W${h.r.width.toFixed(0)} ${sel(h.el)} "${txt}"`)
  }
  lines.push(`  (${hits.length} total past edge, ${leaves.length} leaves)`)
  if (!hits.length) lines.push('  (nothing past an edge)')
}

let runId = Date.now() % 100000

async function flush(status) {
  out.textContent = `[${status}] sending…\n\n` + lines.join('\n')
  await report(lines.join('\n'))
  out.textContent = `[${status}] sent. Keep this open.\n\n` + lines.join('\n')
}

async function report(text) {
  // No such endpoint exists — the 404s carry the payload into the uvicorn access log, which is
  // how the numbers get off the phone without adding a backend route.
  const chunks = text.match(/[\s\S]{1,1000}/g) || []
  for (let i = 0; i < chunks.length; i++) {
    try { await fetch(`/api/_layout_audit?run=${runId}&i=${i}&of=${chunks.length}&d=${encodeURIComponent(chunks[i])}`) } catch (e) {}
  }
}

async function run() {
  const f = document.getElementById('f')
  await new Promise(r => f.addEventListener('load', r, { once: true }))
  await wait(4000)
  const d = f.contentDocument, w = f.contentWindow

  lines.push('dpr=' + window.devicePixelRatio + ' screenW=' + window.screen.width)
  audit('HOME', d, w)
  await flush('HOME done')

  for (const name of ['Cards', 'Notes', 'Tutor']) {
    const btn = [...d.querySelectorAll('button')].find(b => b.textContent.trim() === name)
    if (!btn) { lines.push(`### ${name}: tab button not found`); continue }
    btn.click()
    await wait(2500)
    audit(name.toUpperCase(), d, w)
    // Sent per tab, not once at the end: closing the page early then yields partial results
    // instead of nothing at all.
    await flush(name + ' done')
  }
  out.textContent = lines.join('\n') + '\n\n[all four sent — done]'
}
run().catch(e => { out.textContent = 'ERROR ' + e.message; report('ERROR ' + e.message) })
</script>
