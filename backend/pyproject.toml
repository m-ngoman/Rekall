[project]
name = "pipcards-backend"
version = "0.1.0"
description = "PipCards API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",  # signs the session cookie via Starlette's SessionMiddleware
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "websockets>=13.0",
    "stripe>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
