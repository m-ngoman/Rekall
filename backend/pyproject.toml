[project]
name = "pipcards-backend"
version = "0.1.0"
description = "PipCards API"
requires-python = ">=3.12"
dependencies = [
    # 0.118 is where a yield dependency's cleanup moved back to after the response is sent. From
    # 0.106 to 0.117 it ran first, so get_db's session was closed before a StreamingResponse body
    # started, and the review, generation and tutor streams all write through that session.
    "fastapi>=0.118",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",  # signs the session cookie via Starlette's SessionMiddleware
    "faster-whisper>=1.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "websockets>=13.0",
    "stripe>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "pg: drives the API against a real Postgres; runs only when TEST_DATABASE_URL is set (see tests/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# tests/ is on sys.path when pytest runs, so its helper modules import as top-level names.
src = [".", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Mistakes rather than style: pyflakes, import order, bugbear, and pycodestyle's error-level
# checks. Line length isn't enforced; it only sets where sorted imports wrap.
select = ["E4", "E7", "E9", "F", "I", "B", "W"]
# Depends(), Query() and File() in argument defaults are how FastAPI declares parameters.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The migrations live in a directory called alembic/, which would otherwise pass for the package.
known-third-party = ["alembic"]
combine-as-imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
